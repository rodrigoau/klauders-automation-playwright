name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-pr-body:
    runs-on: ubuntu-latest
    steps:
      - name: Validate template and screenshot
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          body="$(printf '%s' "$PR_BODY")"
          fail=0

          # Required template sections
          for section in "## Description" "## Ticket" "## Screenshots" "## Checklist"; do
            if ! grep -qF "$section" <<< "$body"; then
              echo "::error::Missing template section '$section'"
              fail=1
            fi
          done

          # At least one image (markdown or <img>)
          if ! grep -qE '!\[[^]]*\]\(https?://[^)]+\)|<img[^>]+src=' <<< "$body"; then
            echo "::error::You must attach at least one screenshot"
            fail=1
          fi

          # Checklist fully completed
          if sed -n '/## Checklist/,$p' <<< "$body" | grep -q -- '- \[ \]'; then
            echo "::error::Complete every checklist item"
            fail=1
          fi

          exit $fail
